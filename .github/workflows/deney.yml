name: Deney
# Elle başlatılır: Actions sekmesi → Deney → Run workflow.
# Her görev ayrı bir makinede paralel çalışır; son iş sonuçları birleştirip tek rapor üretir.
on:
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model adı (araç çağırmayı desteklemeli)
        default: qwen2.5:3b
      tekrar:
        description: Her görev kaç kez çalışsın
        default: '3'
      talimat:
        description: Sistem mesajı
        type: choice
        options: [tarafsiz, durust]
        default: tarafsiz
permissions:
  contents: read
run-name: Deney · ${{ inputs.model }} · ${{ inputs.talimat }}
jobs:
  gorevler:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      liste: ${{ steps.liste.outputs.liste }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: liste
        run: |
          liste=$(node --input-type=module -e "import { gorevleriYukle } from './src/gorevler.js'; console.log(JSON.stringify(gorevleriYukle().map((g) => g.id)))")
          echo "liste=$liste" >> "$GITHUB_OUTPUT"

  deney:
    needs: gorevler
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        gorev: ${{ fromJSON(needs.gorevler.outputs.liste) }}
    env:
      # Girdiler betiğe doğrudan değil, ortam değişkeniyle verilir (komut enjeksiyonuna karşı).
      MODEL: ${{ inputs.model }}
      TEKRAR: ${{ inputs.tekrar }}
      TALIMAT: ${{ inputs.talimat }}
      GOREV: ${{ matrix.gorev }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Ollama kur
        run: curl -fsSL https://ollama.com/install.sh | sh
      - name: Ollama sunucusunun hazır olmasını bekle
        run: |
          if ! curl -sf http://localhost:11434/api/tags > /dev/null; then
            (ollama serve > /tmp/ollama.log 2>&1 &)
          fi
          for i in $(seq 1 60); do
            curl -sf http://localhost:11434/api/tags > /dev/null && exit 0
            sleep 1
          done
          echo "Ollama başlamadı" >&2
          cat /tmp/ollama.log 2>/dev/null || true
          exit 1
      - name: Modeli indir
        run: ollama pull "$MODEL"
      - name: Deneyi çalıştır
        run: node src/calistir.js --model "$MODEL" --tekrar "$TEKRAR" --talimat "$TALIMAT" --gorev "$GOREV" --cikis "sonuclar/$GOREV"
      - name: Sonuçları yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sonuclar-${{ matrix.gorev }}
          path: sonuclar/
          if-no-files-found: ignore

  birlestir:
    needs: deney
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          pattern: sonuclar-*
          path: indirilen
      - name: Raporu üret
        run: |
          node src/birlestir.js indirilen > indirilen/RAPOR.md
          cat indirilen/RAPOR.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: deney-sonucu
          path: indirilen/
